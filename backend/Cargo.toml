[package]
name = "dbx-plugin-apifox"
version = "1.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace]
# vendored SDK 不当成本 workspace 的成员：它按上游原样保留，不该被我们这边的
# clippy -D warnings 顺手打回去（它自己有自己的 lint 口径）。
exclude = ["vendor/dbx-plugin-sdk"]

[dependencies]
# dbx-plugin-sdk 没发布到 crates.io。这里必须写成版本依赖、不能写成 path 依赖：
# 官方 `dbx-plugin package` 打包时会自带一份 SDK 并注入
# `--config patch.crates-io.dbx-plugin-sdk.path=<cli>/sdk-root/...`，再加上 --locked。
# 一旦改成 path 依赖，那条 patch 就「未使用」，cargo 要重新写 Cargo.lock，--locked 直接拒绝，
# 五个平台全红（2026-11-21 v0.9.0 发布首跑就是这么挂的）。
# 本地/CI 裸构建（没有 CLI 时）用仓库里那份副本：
#   cargo build --release --locked \
#     --config 'patch.crates-io.dbx-plugin-sdk.path="vendor/dbx-plugin-sdk"'
dbx-plugin-sdk = { version = "0.1.0" }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
base64 = "0.22"
# WebSocket：tungstenite 的同步版，与这里其余部分（reqwest blocking）同路子，
# 不引入 tokio 运行时 —— 两套调度混在一起，出问题最难查。
# TLS 用 rustls + native roots：五平台构建里只有它不需要额外系统库（openssl 在 Windows runner 上很麻烦）。
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }

# Keep plugin binaries close to the host app's size: default release settings
# leave ~20MB of symbols and unoptimized generic code in an OpenDAL-sized backend.
# panic stays "unwind" so the sidecar protocol can report panics as errors.
[profile.release]
strip = true
lto = true
codegen-units = 1
